<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager.tunnel.Recovery"/>
    <allow send_destination="org.freedesktop.NetworkManager.tunnel.Recovery"/>
  </policy>
  <policy context="default">
    <deny own="org.freedesktop.NetworkManager.tunnel.Recovery"/>
    <deny send_destination="org.freedesktop.NetworkManager.tunnel.Recovery"/>
    <allow send_destination="org.freedesktop.NetworkManager.tunnel.Recovery"
           send_path="/org/freedesktop/NetworkManager/tunnel/Recovery"
           send_interface="org.freedesktop.NetworkManager.tunnel.Recovery"
           send_type="method_call"
            send_member="GetStatus"/>
    <allow send_destination="org.freedesktop.NetworkManager.tunnel.Recovery"
           send_path="/org/freedesktop/NetworkManager/tunnel/Recovery"
           send_interface="org.freedesktop.NetworkManager.tunnel.Recovery"
           send_type="method_call"
           send_member="GetReleaseToken"/>
    <!-- Disconnect has an independent Polkit network-control check in the helper. -->
    <allow send_destination="org.freedesktop.NetworkManager.tunnel.Recovery"
           send_path="/org/freedesktop/NetworkManager/tunnel/Recovery"
           send_interface="org.freedesktop.NetworkManager.tunnel.Recovery"
           send_type="method_call"
           send_member="Disconnect"/>
  </policy>
</busconfig>
