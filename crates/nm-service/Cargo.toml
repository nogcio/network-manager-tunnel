[package]
name = "nm-tunnel-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.nm-tunnel]
layer = "integration"

[dependencies]
nm-tunnel-profile.workspace = true
nm-tunnel-engine.workspace = true
lwip.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "process", "signal", "sync", "fs"] }
zbus.workspace = true
secrecy.workspace = true
uuid.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
async-io = "=2.6.0"
socket2 = { version = "0.6", features = ["all"] }
rustix = { version = "1.1", features = ["net", "fs", "process"] }
tun-rs = { version = "=2.8.13", default-features = false }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
