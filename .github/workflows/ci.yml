# Adapted from Kedra's CI; see docs/third-party.md. No deployment/release authority.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Linux repository and Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Native COSMIC build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo xtask check --non-interactive
      - run: cargo xtask features --non-interactive
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: rust-check-logs
          path: target/xtask/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Advisories, licenses and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
          checksum: true
          fallback: none
      - run: cargo deny --locked check --warn unmaintained

  repository:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          mise_toml: |
            [tools]
            "aqua:rvben/rumdl" = "0.3.0"
            "aqua:lycheeverse/lychee" = "0.24.2"
      - run: rumdl check .
      - run: lychee --offline --include-fragments --no-progress --root-dir "$PWD" './*.md' docs crates frontends

  secrets:
    name: Source and history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          mise_toml: |
            [tools]
            "aqua:gitleaks/gitleaks" = "8.24.2"
      - run: gitleaks git --redact --no-banner .

  workflows:
    name: Workflow syntax and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          mise_toml: |
            [tools]
            "aqua:rhysd/actionlint" = "1.7.12"
            "aqua:zizmorcore/zizmor" = "1.31.1"
      - run: actionlint -color
      - run: zizmor --offline --no-progress .github/workflows

  required:
    name: CI required
    if: ${{ always() }}
    needs: [rust, supply-chain, repository, secrets, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every dependency job to succeed
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$JOB_RESULTS"
          for result in $JOB_RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "FAIL: every required job must succeed; failures, cancellations and skips are rejected"
              exit 1
            fi
          done
          echo "PASS: all required jobs succeeded"
