# cargo-about 0.8.4 (Arch's packaged version) collects AUR production notices.
# This is notice collection, not dependency admission (deny.toml).
accepted = ["MIT", "Apache-2.0", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "Unlicense", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0", "OFL-1.1"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = ["x86_64-unknown-linux-gnu"]
# Collect from resolved sources, not an external license-metadata service.
no-clearly-defined = true

